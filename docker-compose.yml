# Jypra SEO agent stack: n8n (automation) + SearXNG (free, self-hosted search)
# Usage:
#   1. docker compose up -d
#   2. After first start, edit ./searxng/settings.yml to enable the JSON API
#      (see searxng-settings.patch.yml), then: docker compose restart searxng
#   3. Open n8n at http://localhost:5678 and import n8n-seo-rank-tracker.json
#
# n8n reaches SearXNG internally at http://searxng:8080 (same docker network).

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - GENERIC_TIMEZONE=Australia/Brisbane
      - TZ=Australia/Brisbane
      # Allow expressions to read env vars (used if you switch SearXNG URL to an env var):
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - searxng

  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    ports:
      - "8080:8080"          # remove this line to keep SearXNG private to the n8n network only
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
    volumes:
      - ./searxng:/etc/searxng:rw

  redis:                     # optional cache SearXNG can use; keeps it snappy
    image: docker.io/valkey/valkey:8-alpine
    container_name: searxng-redis
    restart: unless-stopped
    command: valkey-server --save 30 1 --loglevel warning
    volumes:
      - redis_data:/data

volumes:
  n8n_data:
  redis_data:
